<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Everyday English — A1 to C2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app" src="app.html" title="Everyday English"></iframe>
<script>
(function(){
  var frame=document.getElementById('app');
  frame.addEventListener('load',function(){
    var d=frame.contentDocument;
    if(!d||!d.head)return;
    var s=d.createElement('script');
    s.src='site-fix.js';
    s.async=false;
    s.onload=function(){
      var r=d.createElement('script');
      r.src='reading-examples.js';
      r.async=false;
      r.onload=function(){
        var t=d.createElement('script');
        t.src='teacher-reading.js';
        t.async=false;
        t.onload=function(){
          var sp=d.createElement('script');
          sp.src='speaking-studio.js';
          sp.async=false;
          sp.onload=function(){
            var v=d.createElement('script');
            v.src='vocabulary-section.js';
            v.async=false;
            v.onload=function(){
              var g=d.createElement('script');
              g.src='teacher-guide.js';
              g.async=false;
              g.onload=function(){
                var m=d.createElement('script');
                m.src='matura-prep.js';
                m.async=false;
                d.head.appendChild(m);
              };
              d.head.appendChild(g);
            };
            d.head.appendChild(v);
          };
          d.head.appendChild(sp);
        };
        d.head.appendChild(t);
      };
      d.head.appendChild(r);
    };
    d.head.appendChild(s);
  });
})();
</script>
</body>
</html>
