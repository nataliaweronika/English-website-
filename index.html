<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WordBloom — A1 to C2</title>
<meta name="description" content="WordBloom: ćwiczenia z angielskiego online (A1–C2), karty pracy dla klas 1–8, matura 2027 i 30 Days of Speaking. English practice, ESL worksheets and speaking activities.">
<link rel="canonical" href="https://wordbloom.ca/">
<link rel="icon" href="/img/wordbloom-badge.png">
<!-- canonical-feature-bundle-20260920 -->
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app" src="app.html" title="WordBloom"></iframe>
<script>
(function(){
  var frame=document.getElementById('app');
  frame.addEventListener('load',function(){
    var d=frame.contentDocument;
    if(!d||!d.head)return;
    // Keep Materials public and separate from the student lesson access gate.
    var nav=d.querySelector('.nav');
    if(nav&&!d.getElementById('wbMaterialsNav')){
      var materials=d.createElement('button');
      materials.id='wbMaterialsNav';
      materials.type='button';
      materials.innerHTML='📎 <label>Materiały</label>';
      materials.setAttribute('aria-label','Materiały · Resources');
      materials.onclick=function(){window.location.href='materials.html';};
      nav.insertBefore(materials,nav.firstChild);
    }
    if(nav&&!d.getElementById('wbPoetryNav')){
      var poetry=d.createElement('button');
      poetry.id='wbPoetryNav';
      poetry.type='button';
      poetry.innerHTML='✍️ <label>Poetry in Motion</label>';
      poetry.setAttribute('aria-label','Poetry in Motion');
      poetry.onclick=function(){window.location.href='poetry-in-motion.html';};
      var m0=d.getElementById('wbMaterialsNav');
      nav.insertBefore(poetry,m0?m0.nextSibling:nav.firstChild);
    }

    if(nav&&!d.getElementById('wbAboutNav')){
      var about=d.createElement('button');
      about.id='wbAboutNav';about.type='button';
      about.innerHTML='🌱 <label>O mnie</label>';
      about.setAttribute('aria-label','O mnie · About me');
      about.onclick=function(){window.location.href='about-me.html';};
      nav.insertBefore(about,nav.querySelector('[data-page="home"]'));
    }


    // Reading, Listening, Speaking and Writing now live in the redesigned Skills Studio.
    var SKILL_PAGES={reading:1,listening:1,speaking:1,writing:1};
    d.addEventListener('click',function(e){
      var b=e.target.closest&&e.target.closest('.nav button[data-page]');
      if(b&&SKILL_PAGES[b.getAttribute('data-page')]){e.preventDefault();e.stopImmediatePropagation();window.location.href='skills.html#'+b.getAttribute('data-page');}
    },true);
    var fw=frame.contentWindow;
    if(fw&&typeof fw.show==='function'&&!fw.show.__skills){var orig=fw.show;fw.show=function(p){if(SKILL_PAGES[p]){window.location.href='skills.html#'+p;return;}return orig.apply(this,arguments);};fw.show.__skills=true;}
    if(nav&&!d.getElementById('wbSkillsNew')){
      var $sk=nav.querySelector('button[data-page="speaking"]');
      if($sk){var tag=d.createElement('span');tag.id='wbSkillsNew';tag.textContent='NEW';tag.style.cssText='margin-left:6px;font:800 10px Inter,system-ui,sans-serif;background:#5968e8;color:#fff;border-radius:99px;padding:2px 6px;vertical-align:middle';$sk.appendChild(tag);}
    }

    // Keep Home first; My Words has its own public sample and personal-code gate.
    var homeButton=nav&&nav.querySelector('button[data-page="home"]');
    if(homeButton)nav.insertBefore(homeButton,nav.firstChild);
    if(nav&&!d.getElementById('wbMyWordsNav')){
      var wordsButton=d.createElement('button');
      wordsButton.id='wbMyWordsNav';wordsButton.type='button';
      wordsButton.innerHTML='<label>Moje słowa</label>';
      wordsButton.setAttribute('aria-label','Moje słowa · My Words');
      wordsButton.onclick=function(){window.location.href='my-words.html';};
      nav.insertBefore(wordsButton,homeButton?homeButton.nextSibling:nav.firstChild);
    }

    // About me sits at the top of the menu, right after Home.
    var aboutBtn=d.getElementById('wbAboutNav');
    if(aboutBtn&&homeButton)nav.insertBefore(aboutBtn,homeButton.nextSibling);

    var ac=d.createElement('script');
    ac.src='wordbloom-access.js';
    ac.async=false;
    d.head.appendChild(ac);
    var s=d.createElement('script');
    s.src='site-fix.js';
    s.async=false;
    s.onload=function(){
      var r=d.createElement('script');
      r.src='reading-examples.js';
      r.async=false;
      r.onload=function(){
        var t=d.createElement('script');
        t.src='teacher-reading.js';
        t.async=false;
        t.onload=function(){
          var sp=d.createElement('script');
          sp.src='speaking-studio.js';
          sp.async=false;
          sp.onload=function(){
            var v=d.createElement('script');
            v.src='vocabulary-section.js';
            v.async=false;
            v.onload=function(){
              var g=d.createElement('script');
              g.src='teacher-guide.js';
              g.async=false;
              g.onload=function(){
                var m=d.createElement('script');
                m.src='matura-prep.js';
                m.async=false;
                m.onload=function(){
                  var x=d.createElement('script');
                  x.src='studio-expansion.js';
                  x.async=false;
                  x.onload=function(){
                    var e=d.createElement('script');
                    e.src='matura-exercises.js';
                    e.async=false;
                    e.onload=function(){
                      var hx=d.createElement('script');
                      hx.src='matura-hub-exercises.js';
                      hx.async=false;
                      hx.onload=function(){
                        ['wordbloom-audio.js','wordbloom-study.js','wordbloom-learning.js','wordbloom-print.js'].forEach(function(src){var q=d.createElement('script');q.src=src;q.async=false;d.head.appendChild(q)});
                      };
                      d.head.appendChild(hx);
                    };
                    d.head.appendChild(e);
                  };
                  d.head.appendChild(x);
                };
                d.head.appendChild(m);
              };
              d.head.appendChild(g);
            };
            d.head.appendChild(v);
          };
          d.head.appendChild(sp);
        };
        d.head.appendChild(t);
      };
      d.head.appendChild(r);
    };
    d.head.appendChild(s);
  });
})();
</script>
<!-- Vercel Web Analytics -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
