<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Everyday English — A1 to C2</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" src="app.html" title="Everyday English"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',function(){
  const d=frame.contentDocument;
  if(!d)return;
  const teacher=d.getElementById('tm');
  const student=d.getElementById('sm');
  const teacherNav=d.querySelector('.nav button.teacher-only');
  const openPage=id=>{
    d.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));
    d.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));
    if(d.defaultView)d.defaultView.scrollTo(0,0);
  };
  const setMode=mode=>{
    const isTeacher=mode==='teacher';
    d.body.className=isTeacher?'teacher-mode':'student-mode';
    if(teacher)teacher.classList.toggle('active',isTeacher);
    if(student)student.classList.toggle('active',!isTeacher);
    if(teacherNav)teacherNav.style.display=isTeacher?'':'none';
    openPage(isTeacher?'teacher':'home');
  };
  if(teacher)teacher.onclick=e=>{e.preventDefault();setMode('teacher')};
  if(student)student.onclick=e=>{e.preventDefault();setMode('student')};
  setMode('student');
});
</script>
</body>
</html>
